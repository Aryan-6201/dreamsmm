name: SMMGen Rate Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync SMMGen rates
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/admin/smmgen-sync"
